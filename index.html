<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRT | Student Transit Demo</title>
<style>
:root{--blue:#0877b9;--dark:#12334a;--light:#eef6fa;--border:#dbe6ed}*{box-sizing:border-box}body{margin:0;background:#e8eef2;color:#183345;font-family:Arial,Helvetica,sans-serif}.shell{max-width:470px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 35px #17364a18}.top{background:linear-gradient(135deg,#0069a7,#0c93cb);color:white;padding:25px 22px 20px}.brand{font-size:28px;font-weight:800;letter-spacing:.4px}.tag{font-size:11px;background:#ffffff2b;border:1px solid #ffffff60;padding:4px 7px;border-radius:6px;display:inline-block;margin-top:7px}.top p{margin:13px 0 0;opacity:.95}.content{padding:22px;padding-bottom:95px}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:20px 0 12px}.muted{color:#647b89;font-size:14px;line-height:1.5}.card{background:white;border:1px solid var(--border);border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 5px 18px #17364a0b}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.price{font-weight:800;font-size:19px;color:#075e96}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 15px;font-weight:700}button.primary{background:var(--blue);color:white}button.secondary{background:#e5f3fb;color:#075e96}button.outline{border:1px solid #b4d5e8;background:white;color:#075e96}button:disabled{opacity:.55;cursor:not-allowed}.full{width:100%;margin-top:10px}label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}input{width:100%;border:1px solid #bdced9;border-radius:10px;padding:13px;font:inherit}input:focus{outline:2px solid #73c5ef}.notice{background:#fff4d9;border:1px solid #f1d49a;border-radius:10px;padding:12px;font-size:12px;color:#654a16;line-height:1.5;margin:14px 0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:470px;width:100%;display:flex;background:#fff;border-top:1px solid var(--border);padding:7px 5px max(8px,env(safe-area-inset-bottom))}.nav button{flex:1;background:transparent;color:#6c8090;font-size:11px;padding:9px 2px}.nav button.active{color:var(--blue);background:#eaf6fc}.nav span{display:block;font-size:22px;margin-bottom:3px}.pill{background:#eaf6fc;color:#075e96;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.ticket{background:linear-gradient(145deg,#0877b9,#10456c);color:white;border-radius:18px;padding:22px;margin:15px 0;position:relative;overflow:hidden}.ticket h2{font-size:24px;margin:8px 0}.ticket .stamp{background:#fff;color:#084f7a;border-radius:8px;text-align:center;font-weight:900;letter-spacing:2px;padding:17px;margin-top:20px}.ticket .watermark{font-size:12px;text-align:center;margin-top:12px;font-weight:bold;color:#ffdf9d}.small{font-size:12px}.empty{text-align:center;padding:30px 10px;color:#657b88}.error{color:#b32929;font-size:13px;margin-top:9px}.success{color:#16754d;font-size:13px;margin-top:9px}.hidden{display:none!important}.hero{background:var(--light);border-radius:16px;padding:20px;margin-bottom:20px}.hero strong{font-size:21px}.countdown{font-size:30px;font-weight:800;letter-spacing:1px}.divider{border-top:1px solid var(--border);margin:16px 0}.link{background:none;color:#075e96;padding:8px 0;text-decoration:underline}.footer{text-align:center;font-size:11px;color:#82919a;margin:28px 0 0}
</style>
</head>
<body><div class="shell"><header class="top"><div class="brand">GRT <span style="font-weight:400;font-size:15px">Transit Demo</span></div><div class="tag">UNOFFICIAL STUDENT PROJECT</div><p id="headerSubtitle">Explore a sample mobile ticket experience</p></header><main id="app" class="content"></main><nav id="nav" class="nav hidden"></nav></div>
<script>
'use strict';
const KEY='grt_student_demo_v1';
const fares=[{id:'single',name:'Single Ride',price:4,detail:'One sample ticket, valid for 2 hours after activation'},{id:'five',name:'5-Ride Bundle',price:18,detail:'Five sample single-ride tickets'},{id:'day',name:'Day Pass',price:9,detail:'Sample day pass (24 hours after activation)'}];
let state=load();let screen=state.session?'home':'welcome';let interval=null;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.tickets)&&Array.isArray(v.users))return v}catch(e){}return {users:[],session:null,tickets:[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function el(id){return document.getElementById(id)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function currentUser(){return state.users.find(u=>u.email===state.session)}
function myTickets(){return state.tickets.filter(t=>t.owner===state.session)}
function go(to){screen=to;render();window.scrollTo(0,0)}
function render(){if(interval){clearInterval(interval);interval=null}el('headerSubtitle').textContent=state.session?'Mobile ticketing • Practice interface':'Explore a sample mobile ticket experience';const logged=!!currentUser();if(!logged&&!['welcome','login','signup'].includes(screen))screen='welcome';el('nav').classList.toggle('hidden',!logged);if(logged){el('nav').innerHTML=[['home','⌂','Home'],['store','▣','Buy'],['wallet','▤','Wallet'],['account','◉','Account']].map(([id,icon,label])=>`<button class="${screen===id?'active':''}" data-go="${id}"><span>${icon}</span>${label}</button>`).join('')}
const pages={welcome:welcomePage,login:loginPage,signup:signupPage,home:homePage,store:storePage,wallet:walletPage,account:accountPage,ticket:ticketPage};el('app').innerHTML=(pages[screen]||welcomePage)();if(screen==='ticket'){tick();interval=setInterval(tick,1000)}}
function welcomePage(){return `<div class="hero"><strong>Welcome aboard</strong><p class="muted">A classroom demonstration of a transit ticket app.</p></div><h1>Travel made simple</h1><p class="muted">Create a practice account, explore sample fares, and activate a demo ticket.</p><button class="primary full" data-go="signup">Create Demo Account</button><button class="secondary full" data-go="login">Log In</button><div class="notice">Classroom demonstration only. Not affiliated with Grand River Transit. No real fares, payments, or valid tickets.</div>`}
function loginPage(){return `<h1>Log in</h1><p class="muted">Use the fictional account you created for this demo.</p><form id="loginForm"><label>Email</label><input name="email" type="email" autocomplete="off" required><label>Password</label><input name="password" type="password" required><div id="formMsg"></div><button class="primary full" type="submit">Log In</button></form><button class="link" data-go="signup">New here? Create an account</button><div class="notice">Use a made-up password, not a password you use elsewhere. Demo accounts are saved only in this browser.</div>`}
function signupPage(){return `<h1>Create account</h1><p class="muted">Use fictional information for your classroom demonstration.</p><form id="signupForm"><label>Display name</label><input name="name" maxlength="50" required placeholder="e.g. Alex Student"><label>Demo email</label><input name="email" type="email" autocomplete="off" required placeholder="alex@example.com"><label>Demo password (minimum 6 characters)</label><input name="password" type="password" minlength="6" required><div id="formMsg"></div><button class="primary full" type="submit">Create Account</button></form><button class="link" data-go="login">Already have an account? Log in</button><div class="notice">This is not a secure authentication service. Never use your real passwords or personal information.</div>`}
function homePage(){const u=currentUser();const available=myTickets().filter(t=>!t.activatedAt).length;return `<h1>Hello, ${escapeHtml(u.name)}!</h1><p class="muted">Welcome to your transit demo dashboard.</p><div class="hero"><div class="row"><div><div class="small">Tickets ready to activate</div><strong>${available}</strong></div><span style="font-size:38px">🚌</span></div></div><h2>Quick actions</h2><div class="card"><div class="row"><div><b>Buy Tickets</b><p class="muted">Explore sample fares</p></div><button class="primary" data-go="store">Browse</button></div></div><div class="card"><div class="row"><div><b>Ticket Wallet</b><p class="muted">View your demo tickets</p></div><button class="secondary" data-go="wallet">Open</button></div></div><h2>About this demo</h2><p class="muted">A student-built project featuring local demo accounts, a simulated ticket store, and a live ticket countdown.</p>`}
function storePage(){return `<h1>Buy tickets</h1><p class="muted">Select a fare to add sample tickets to your wallet. No payment required.</p>${fares.map(f=>`<div class="card"><div class="row"><b>${f.name}</b><span class="price">$${f.price.toFixed(2)}</span></div><p class="muted">${f.detail}</p><button class="primary full" data-buy="${f.id}">Add Demo Ticket${f.id==='five'?'s':''}</button></div>`).join('')}<div class="notice">Prices are fictional examples, not current GRT fares. Purchases are simulated and cannot be used for travel.</div>`}
function walletPage(){const tickets=myTickets().slice().reverse();return `<h1>My ticket wallet</h1><p class="muted">Your sample tickets are stored in this browser.</p>${tickets.length?tickets.map(t=>{const expiry=t.activatedAt+t.duration;const status=!t.activatedAt?'Not activated':Date.now()<expiry?'Active demo':'Expired';return `<div class="card"><div class="row"><div><b>${escapeHtml(t.name)}</b><p class="muted">${status}</p></div><span class="pill">DEMO</span></div><button class="secondary full" data-ticket="${t.id}">View Ticket</button></div>`}).join(''):`<div class="empty">No tickets yet.<p>Visit Buy Tickets to add a sample fare.</p><button class="primary" data-go="store">Browse tickets</button></div>`}`}
function ticketPage(){const t=myTickets().find(x=>x.id===selectedTicket);if(!t)return `<h1>Ticket not found</h1><button class="secondary" data-go="wallet">Back to wallet</button>`;return `<button class="link" data-go="wallet">← Back to wallet</button><div class="ticket"><div class="small">GRT TRANSIT • STUDENT DEMO</div><h2>${escapeHtml(t.name)}</h2><div class="small">Sample ticket #${escapeHtml(t.id.slice(-6).toUpperCase())}</div><div class="stamp">SAMPLE ONLY<br><span style="font-size:12px;letter-spacing:0">NOT SCANNABLE</span></div><div class="watermark">NOT VALID FOR TRAVEL</div></div><div class="card"><b>Ticket status</b><p id="ticketStatus" class="muted">Checking...</p><div id="timer" class="countdown"></div><button id="activateButton" class="primary full ${t.activatedAt?'hidden':''}" data-activate="${t.id}">Activate Demo Ticket</button></div><div class="notice">This sample contains no barcode, QR code, or fare credential. It cannot be scanned or used to board transit.</div>`}
function accountPage(){const u=currentUser();return `<h1>My account</h1><div class="card"><div class="small muted">Display name</div><b>${escapeHtml(u.name)}</b><div class="divider"></div><div class="small muted">Email</div><b>${escapeHtml(u.email)}</b></div><div class="card"><b>Demo data</b><p class="muted">${myTickets().length} sample tickets in your wallet.</p><button class="outline full" id="clearTickets">Clear My Tickets</button></div><button class="secondary full" id="logout">Log Out</button><div class="notice">This app is an unofficial student project. Demo accounts are stored locally and are not suitable for real credentials.</div>`}
let selectedTicket=null;
function tick(){const t=myTickets().find(x=>x.id===selectedTicket);if(!t||!el('timer'))return;if(!t.activatedAt){el('ticketStatus').textContent='Ready to activate';el('timer').textContent='Not started';return}const remain=Math.max(0,t.activatedAt+t.duration-Date.now());const hours=Math.floor(remain/3600000),minutes=Math.floor(remain%3600000/60000),seconds=Math.floor(remain%60000/1000);el('ticketStatus').textContent=remain?'Active sample ticket — time remaining':'Expired sample ticket';el('timer').textContent=[hours,minutes,seconds].map(x=>String(x).padStart(2,'0')).join(':')}
function message(msg){if(el('formMsg'))el('formMsg').innerHTML=`<p class="error">${escapeHtml(msg)}</p>`}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.dataset.go){go(btn.dataset.go);return}if(btn.dataset.buy){const fare=fares.find(f=>f.id===btn.dataset.buy);if(!fare)return;const count=fare.id==='five'?5:1;for(let i=0;i<count;i++)state.tickets.push({id:'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2,9),owner:state.session,name:fare.id==='five'?'Single Ride':fare.name,duration:fare.id==='day'?86400000:7200000,activatedAt:null});save();go('wallet');return}if(btn.dataset.ticket){selectedTicket=btn.dataset.ticket;go('ticket');return}if(btn.dataset.activate){const t=myTickets().find(x=>x.id===btn.dataset.activate);if(t&&!t.activatedAt){t.activatedAt=Date.now();save();render()}return}if(btn.id==='logout'){state.session=null;save();go('welcome')}if(btn.id==='clearTickets'){if(confirm('Remove your sample tickets?')){state.tickets=state.tickets.filter(t=>t.owner!==state.session);save();render()}}});
document.addEventListener('submit',e=>{if(e.target.id==='signupForm'){e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));if(!name||!email.endsWith('@example.com'))return message('Use a display name and a fictional @example.com email.');if(password.length<6)return message('Use at least 6 characters.');if(state.users.some(u=>u.email===email))return message('This demo email already exists.');state.users.push({name,email,password});state.session=email;save();go('home')}if(e.target.id==='loginForm'){e.preventDefault();const f=new FormData(e.target),email=String(f.get('email')).trim().toLowerCase(),password=String(f.get('password'));if(!state.users.some(u=>u.email===email&&u.password===password))return message('Demo email or password not found.');state.session=email;save();go('home')}});
render();
</script></body></html>
