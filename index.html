<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRT School Demo | Transit Portal</title><style>
:root{--blue:#0878b9;--navy:#11344b;--bg:#eef4f8;--line:#dce6ec;--ink:#203748;--muted:#647887}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.top{background:#fff;border-bottom:1px solid var(--line);padding:15px max(20px,calc((100% - 1060px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;gap:10px;align-items:center;font-weight:850;color:var(--navy);font-size:20px}.mark{background:var(--blue);color:white;border-radius:9px;padding:9px 11px}.tag{font-size:11px;color:#526a79;background:#e7f2f9;border-radius:20px;padding:5px 9px}.wrap{max-width:1060px;margin:30px auto;padding:0 16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 5px 18px #17384b0a}.auth{max-width:450px;margin:50px auto}.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);font-weight:750}.h1{font-size:27px;font-weight:800;margin:9px 0 8px}.muted{color:var(--muted);line-height:1.55}label{display:block;margin:17px 0 6px;font-weight:650;font-size:13px}input,select{width:100%;padding:12px;border:1px solid #cddce5;border-radius:9px;background:white;color:var(--ink)}input:focus{outline:2px solid #9fd4f4}.btn{background:var(--blue);color:white;border:0;padding:11px 17px;border-radius:9px;font-weight:700}.btn.secondary{background:#e8f2f8;color:#12618e}.btn.ghost{background:white;color:var(--navy);border:1px solid var(--line)}.btn.danger{background:#a53642}.full{width:100%;margin-top:19px}.flex{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.between{display:flex;align-items:center;justify-content:space-between;gap:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}.tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 15px;font-weight:650;color:var(--navy)}.tabs button.active{background:var(--navy);color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.metric{font-size:29px;font-weight:850;margin:10px 0}.price{font-size:26px;font-weight:850;color:var(--navy)}.ticket{border:1px solid #cbdfe9;background:linear-gradient(130deg,#fff,#f1f9fe);padding:20px;border-radius:15px}.status{display:inline-block;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:750;background:#edf2f5;color:#47606e}.status.approved,.status.active{background:#dcf7e8;color:#17663b}.status.pending{background:#fff2d8;color:#865a10}.status.rejected{background:#fce6e6;color:#a02c32}.alert{padding:12px 15px;border-radius:10px;background:#e6f3fb;color:#185475;margin:12px 0}.alert.error{background:#ffebeb;color:#9c2632}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid var(--line);border-radius:11px;background:white;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tiny{font-size:12px;color:var(--muted)}.scan{height:145px;border-radius:12px;background:repeating-linear-gradient(45deg,#e7f2fa 0 13px,#f8fbfe 13px 26px);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:2px dashed #91b7cb}.scan:before{content:"";position:absolute;left:0;right:0;height:3px;background:#1687c7;animation:sweep 2.4s linear infinite}@keyframes sweep{0%{top:0}100%{top:100%}}.scan span{font-size:21px;font-weight:900;letter-spacing:.12em;color:#285c7d;background:#ffffffd9;padding:10px 14px;transform:rotate(-8deg)}footer{text-align:center;color:#6c7f8d;font-size:12px;padding:28px}.hidden{display:none!important}@media(max-width:600px){.top{padding:12px 15px}.panel{padding:18px}.wrap{margin:18px auto}.h1{font-size:23px}}
</style></head><body><header class="top"><div class="brand"><span class="mark">GRT</span><span>Transit Portal</span></div><span class="tag">UNOFFICIAL SCHOOL DEMO</span></header><main class="wrap"><div id="message" role="status"></div><div id="app"><div class="panel auth">Loading…</div></div></main><footer>Student project • Not affiliated with Grand River Transit • No real tickets or payments</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const URL='https://lxropsrskydkxgopbjvg.supabase.co';
const KEY='sb_publishable_LRf_ZSMQVA8LrKFF_yM6uQ_v7R83xcb';
const db=window.supabase?.createClient(URL,KEY);
const $=id=>document.getElementById(id);let me=null,profile=null,admin=false,tab='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s,error=false){$('message').innerHTML=`<div class="alert ${error?'error':''}">${esc(s)}</div>`;window.scrollTo({top:0,behavior:'smooth'});}function clear(){ $('message').innerHTML='';}
function btn(text,fn,kind='secondary'){return `<button class="btn ${kind}" onclick="${fn}">${text}</button>`}
function authScreen(mode='login'){tab=mode;let signup=mode==='signup',reset=mode==='reset';$('app').innerHTML=`<section class="panel auth"><div class="eyebrow">Transit account</div><h1 class="h1">${reset?'Reset password':signup?'Create an account':'Welcome back'}</h1><p class="muted">${reset?'We will email a password reset link.':signup?'Registration requires administrator approval.':'Sign in to access your demo transit wallet.'}</p><form id="authform">${signup?'<label for="name">Full name</label><input id="name" required maxlength="90" autocomplete="name">':''}<label for="email">Email</label><input id="email" type="email" required autocomplete="email">${!reset?`<label for="password">Password</label><input id="password" type="password" required minlength="8" autocomplete="${signup?'new-password':'current-password'}">`:''}<button class="btn full" type="submit">${reset?'Send reset email':signup?'Request account':'Sign in'}</button></form><div class="flex" style="margin-top:18px">${btn('Sign in',"authScreen('login')")}${btn('Register',"authScreen('signup')")}${btn('Forgot password',"authScreen('reset')",'ghost')}</div></section>`;$('authform').onsubmit=async e=>{e.preventDefault();clear();let email=$('email').value.trim(),password=$('password')?.value;let res;if(reset){res=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});}else if(signup){res=await db.auth.signUp({email,password,options:{data:{full_name:$('name').value.trim()}}});}else{res=await db.auth.signInWithPassword({email,password});}if(res.error)return notice(res.error.message,true);if(reset)return notice('If this address is registered, a reset email will be sent.');if(signup){authScreen('login');return notice('Registration submitted. Confirm your email if asked, then wait for admin approval.');}await load();};}
async function load(){clear();if(!db){$('app').innerHTML='<div class="panel">Could not load the connection library. Check your internet connection.</div>';return;}let {data:{user},error}=await db.auth.getUser();if(error||!user){me=null;return authScreen();}me=user;let [p,a]=await Promise.all([db.from('profiles').select('id,full_name,status,created_at').eq('id',me.id).maybeSingle(),db.rpc('is_admin')]);if(p.error)return notice('Unable to read profile: '+p.error.message,true);profile=p.data;admin=a.data===true;if(!profile){$('app').innerHTML='<div class="panel">Your profile is still being created. Please refresh shortly.</div>';return;}if(!admin&&profile.status!=='approved'){let s=profile.status;$('app').innerHTML=`<section class="panel auth"><h1 class="h1">Account ${esc(s)}</h1><p class="muted">${s==='pending'?'Your registration is waiting for administrator approval.':'This account has not been approved. Contact the project administrator.'}</p><div class="flex">${btn('Check again','load()')}${btn('Log out','logout()','ghost')}</div></section>`;return;}showShell();}
function showShell(){let tabs=[['home','Home'],['store','Tickets'],['wallet','My Wallet'],['account','Account']];if(admin)tabs.push(['admin','Admin Panel']);$('app').innerHTML=`<div class="between" style="margin-bottom:17px"><div><div class="eyebrow">GRT School Demo</div><h1 class="h1" style="margin-bottom:0">${admin?'Management & Transit':'Transit dashboard'}</h1></div>${btn('Log out','logout()','ghost')}</div><nav class="tabs">${tabs.map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}</nav><div id="view"></div>`;render();}
function go(t){tab=t;clear();showShell();}async function logout(){await db.auth.signOut();me=null;profile=null;admin=false;authScreen();}
function render(){if(tab==='home')$('view').innerHTML=`<div class="grid"><div class="panel"><div class="eyebrow">Your transit</div><h2>Plan your demo trip</h2><p class="muted">Browse sample tickets and manage your demonstration wallet.</p>${btn('Browse tickets',"go('store')",'')}</div><div class="panel"><div class="eyebrow">My wallet</div><h2>Demo tickets</h2><p class="muted">View unused and activated tickets.</p>${btn('Open wallet',"go('wallet')",'')}</div><div class="panel"><div class="eyebrow">Project notice</div><h2>Classroom simulation</h2><p class="muted">All purchases and fare visuals are simulated. No valid transit credentials are issued.</p></div></div>`;else if(tab==='store')store();else if(tab==='wallet')wallet();else if(tab==='account')account();else if(tab==='admin')adminPage();}
const products=[{name:'Single ride',price:'$4.00',desc:'One sample ride • 2-hour demo window'},{name:'Day pass',price:'$8.00',desc:'Sample day pass'},{name:'Monthly pass',price:'$95.00',desc:'Sample monthly pass'}];function store(){$('view').innerHTML=`<h2>Ticket store</h2><p class="muted">No payment is collected. Prices are illustrative only.</p><div class="grid">${products.map((p,i)=>`<article class="panel"><div class="eyebrow">Sample fare</div><h2>${p.name}</h2><div class="price">${p.price}</div><p class="muted">${p.desc}</p>${btn('Add demo ticket',`purchase(${i})`,'')}</article>`).join('')}</div>`;}
async function purchase(i){if(!confirm('Add a FREE demonstration ticket? No payment will be charged.'))return;let r=await db.from('tickets').insert({user_id:me.id,ticket_type:products[i].name});if(r.error)return notice(r.error.message,true);notice('Demo ticket added to your wallet.');}
async function wallet(){let v=$('view');v.innerHTML='<div class="panel">Loading wallet…</div>';let {data,error}=await db.from('tickets').select('id,ticket_type,status,created_at,activated_at').eq('user_id',me.id).order('created_at',{ascending:false});if(error)return notice(error.message,true);v.innerHTML=`<div class="between"><h2>My ticket wallet</h2>${btn('Get demo ticket',"go('store')")}</div>${!data.length?'<div class="panel">No demo tickets yet.</div>':`<div class="grid">${data.map(t=>{let end=t.activated_at?new Date(t.activated_at).getTime()+7200000:0;let active=t.status==='active'&&Date.now()<end;let state=t.status==='active'&&!active?'expired':t.status;return `<article class="ticket"><div class="between"><strong>${esc(t.ticket_type)}</strong><span class="status ${state}">${state.toUpperCase()}</span></div><p class="tiny">Created ${new Date(t.created_at).toLocaleString()}</p>${active?`<div class="scan"><span>DEMO ONLY</span></div><p class="muted">Sample visual — not scannable or valid for travel</p><p><strong>Time remaining: <span data-end="${end}">—</span></strong></p>`:state==='unused'?`<p class="muted">Ready to activate</p>${btn('Activate demo ticket',`activate('${t.id}')`,'')}`:'<p class="muted">This demonstration ticket has expired.</p>'}</article>`}).join('')}</div>`}`;tick();}
function tick(){document.querySelectorAll('[data-end]').forEach(el=>{let left=Math.max(0,Number(el.dataset.end)-Date.now());let min=Math.floor(left/60000),sec=Math.floor(left%60000/1000);el.textContent=`${Math.floor(min/60)}h ${String(min%60).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;});}setInterval(tick,1000);
async function activate(id){let r=await db.rpc('activate_demo_ticket',{target_ticket_id:id});if(r.error)return notice(r.error.message,true);wallet();}
function account(){$('view').innerHTML=`<div class="panel"><h2>My account</h2><p><strong>Name:</strong> ${esc(profile.full_name||'Not provided')}</p><p><strong>Email:</strong> ${esc(me.email)}</p><p><strong>Status:</strong> <span class="status ${profile.status}">${esc(profile.status)}</span></p><p><strong>Role:</strong> ${admin?'Administrator':'Passenger'}</p><p class="muted">Password recovery is available on the sign-in screen.</p></div>`;}
async function adminPage(){if(!admin)return go('home');let v=$('view');v.innerHTML='<div class="panel">Loading admin dashboard…</div>';let [users,tickets]=await Promise.all([db.from('profiles').select('id,full_name,status,created_at').order('created_at',{ascending:false}),db.from('tickets').select('id,status,created_at')]);if(users.error||tickets.error)return notice((users.error||tickets.error).message,true);let u=users.data,t=tickets.data;v.innerHTML=`<div class="grid"><div class="panel"><div class="eyebrow">Accounts</div><div class="metric">${u.length}</div></div><div class="panel"><div class="eyebrow">Pending approval</div><div class="metric">${u.filter(x=>x.status==='pending').length}</div></div><div class="panel"><div class="eyebrow">Demo tickets</div><div class="metric">${t.length}</div></div></div><h2 style="margin-top:25px">Account management</h2><div class="list">${u.map(x=>`<div class="item"><div><strong>${esc(x.full_name||'Unnamed user')}</strong> ${x.id===me.id?'<span class="tag">YOU</span>':''}<div class="tiny">${esc(x.id)}</div><span class="status ${x.status}">${esc(x.status)}</span></div><div class="flex">${x.id!==me.id?`${btn('Approve',`setStatus('${x.id}','approved')`)}${btn('Reject',`setStatus('${x.id}','rejected')`,'danger')}`:''}</div></div>`).join('')}</div><p class="tiny">Only authorized administrators can approve or reject users. Account passwords are never visible.</p>`;}
async function setStatus(id,status){if(!admin||id===me.id)return;let r=status==='approved'?await db.rpc('approve_user',{target_user_id:id}):await db.from('profiles').update({status:'rejected'}).eq('id',id);if(r.error)return notice(r.error.message,true);notice('Account updated.');adminPage();}
if(db){db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(()=>{let p=prompt('Enter a new password (at least 8 characters):');if(p&&p.length>=8)db.auth.updateUser({password:p}).then(r=>notice(r.error?r.error.message:'Password updated.',!!r.error));},100);}});}load();
</script></body></html>
